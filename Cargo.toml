[package]
name = "jvmcache"
version = "0.1.0"
edition = "2024"
description = "Fast, transparent drop-in compiler cache for javac, kotlinc, kapt, d8, and r8 modeled after ccache"
license = "Apache-2.0"
readme = "README.md"
keywords = ["compiler", "cache", "jvm", "javac", "kotlinc", "d8", "r8"]
categories = ["development-tools::build-utils"]

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
walkdir = "2.5.0"
